version: "3"
services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-15.3-alpine}
    container_name: ${PROJECT_NAME:-marketplace-db-app}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super-secure-password}
      PGDATA: "/var/lib/postgresql/data"
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    command: ["postgres", "-cshared_preload_libraries=pg_stat_statements"]
    ports:
      - 5432:5432
    volumes:
      - marketplace-db-data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-marketplace}-redis
    ports:
      - 6379:6379
    networks:
      - internal

  medusa:
    build:
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-marketplace}-medusa
    depends_on:
      - postgres
      - redis
    restart: always
    ports:
      - 9000:9000
      - 5173:5173
    volumes:
      - ./.env.docker:/application/.env
    command: sh -c "npx medusa db:setup --db marketplace && yarn dev"
    environment:
      - REDIS_URL=redis://redis:6379
    networks:
      - internal

networks:
  internal:
    name: ${PROJECT_NAME:-marketplace}

volumes:
  marketplace-db-data:
    name: ${POSTGRES_VOLUME_NAME:-marketplace-db-data}

